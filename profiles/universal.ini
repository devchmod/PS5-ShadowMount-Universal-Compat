# PS5-ShadowMount-Universal-Compat
# Conservative explicit profile for ShadowMountPlus.
# These values are based on options documented by ShadowMountPlus 1.7.
#
# This file intentionally contains NO:
# - kstuff_no_pause
# - kstuff_delay
# - scanpath
# - per-title exclusions
# Those remain user/title specific.

debug=1
mount_read_only=1
scan_depth=1
stability_wait_seconds=10

exfat_backend=lvd
ufs_backend=lvd

backport_fakelib=1
update_emulators=1
emulators_path=/data/shadowmount/emus

# Disabled by default for deterministic/offline operation.
auto_update_ampr=0

global_fakelib=1
global_fakelib_path=/data/shadowmount/fakelib
global_fakelib_priority=game

kstuff_game_auto_toggle=1
kstuff_crash_detection=1
kstuff_pause_delay_image_seconds=25
kstuff_pause_delay_direct_seconds=15

# Upstream logical sector defaults.
# 64 KB is the exFAT cluster profile, not the LVD logical sector size.
lvd_exfat_sector_size=512
lvd_ufs_sector_size=4096
lvd_pfs_sector_size=4096
