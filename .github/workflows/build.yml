name: Build PS5 Payloads

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "payload/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip clang-18 lld-18

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q ps5-payload-sdk.zip -d /opt
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Build payloads
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make -C payload clean
          make -C payload

      - name: Show build results
        run: |
          ls -lh payload/*.elf
          sha256sum payload/*.elf

      - name: Upload ELF files
        uses: actions/upload-artifact@v4
        with:
          name: PS5-ShadowMount-Universal-Compat
          path: |
            payload/universal-compat.elf
            payload/universal-compat-restore.elf
            profiles/universal.ini
