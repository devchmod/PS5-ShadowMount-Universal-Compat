name: Build ShadowMount Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-shadowmount-diag.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Checkout ShadowMountPlus 1.7
        uses: actions/checkout@v4
        with:
          repository: drakmor/ShadowMountPlus
          ref: "1.7"
          path: shadowmount-src
          fetch-depth: 0

      - name: Checkout pacbrew repository
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo

      - name: Checkout PS5 SDK stubs
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-sdk

      - name: Install Linux build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf \
            automake \
            build-essential \
            clang-18 \
            cmake \
            curl \
            git \
            libarchive-tools \
            libtool \
            lld-18 \
            makepkg \
            meson \
            pacman-package-manager \
            pkg-config \
            python3 \
            python3-yaml \
            xxd \
            zip

      - name: Build PS5 payload SDK
        working-directory: pacbrew-repo/sdk
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 openlibm
        working-directory: pacbrew-repo/openlibm
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 json-c
        working-directory: pacbrew-repo/json-c
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 zlib
        working-directory: pacbrew-repo/zlib
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libpng
        working-directory: pacbrew-repo/libpng
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 libmicrohttpd
        working-directory: pacbrew-repo/libmicrohttpd
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 sqlite
        working-directory: pacbrew-repo/sqlite
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Add ShellCore diagnostic logging
        working-directory: shadowmount-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/sm_shellcore_service.c")
          s = p.read_text()

          rx_old = """  if (!sm_socket_read_full(fd, &request, sizeof(request)))
              return;
          """

          rx_new = """  if (!sm_socket_read_full(fd, &request, sizeof(request)))
              return;

            log_debug(
                "  [SHELLCORE_DIAG] RX magic=0x%08x version=%u op=%u title=%.*s",
                (unsigned)request.magic,
                (unsigned)request.version,
                (unsigned)request.operation,
                (int)sizeof(request.title_id),
                request.title_id);
          """

          tx_old = """  if (shellcore_client_active(fd))
              (void)sm_socket_write_full(fd, &response, sizeof(response));
          """

          tx_new = """  log_debug(
              "  [SHELLCORE_DIAG] TX op=%u title=%.*s status=%d",
              (unsigned)request.operation,
              (int)sizeof(request.title_id),
              request.title_id,
              (int)response.status);

            if (shellcore_client_active(fd))
              (void)sm_socket_write_full(fd, &response, sizeof(response));
          """

          if rx_old not in s:
              raise SystemExit("RX insertion point not found")

          if tx_old not in s:
              raise SystemExit("TX insertion point not found")

          s = s.replace(rx_old, rx_new, 1)
          s = s.replace(tx_old, tx_new, 1)

          p.write_text(s)
          print("Diagnostic logging inserted successfully.")
          PY

          grep -n "SHELLCORE_DIAG" src/sm_shellcore_service.c

      - name: Build ShadowMount diagnostic ELF
        working-directory: shadowmount-src
        run: |
          make clean
          make all PS5_SCE_STUBS_DIR="$GITHUB_WORKSPACE/ps5-sdk/sce_stubs"

          cp shadowmountplus.elf shadowmountplus-diag.elf

          ls -lh shadowmountplus-diag.elf
          sha256sum shadowmountplus-diag.elf

      - name: Upload diagnostic ELF
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMountPlus-1.7-ShellCore-Diagnostic
          path: shadowmount-src/shadowmountplus-diag.elf
          if-no-files-found: error
